<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carga de Documentos - Capacitación</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Carga de Documentos PDF — Capacitación</h1>
      <p>Seleccione la Sede Operativa, el tipo de documento y adjunte el archivo en formato PDF (máx. 15 MB).</p>
    </header>

    <form id="uploadForm">
      <div class="form-group">
        <label for="sede">Sede Operativa *</label>
        <select id="sede" required></select>
      </div>

      <div class="form-group">
        <label for="tipoDocumento">Tipo de Documento (Carpeta) *</label>
        <select id="tipoDocumento" required>
          <option value="LISTAS DE ASISTENCIA">LISTAS DE ASISTENCIA</option>
          <option value="ACTA DE RECEPCION DE LOCAL">ACTA DE RECEPCION DE LOCAL</option>
          <option value="ACTA DE RECEPCION DE EQUIPOS INFORMATICOS">ACTA DE RECEPCION DE EQUIPOS INFORMATICOS</option>
          <option value="ACTA DE DEVOLUCION DE LOCAL">ACTA DE DEVOLUCION DE LOCAL</option>
          <option value="ACTA DE DEVOLUCION DE EQUIPOS INFORMATICOS">ACTA DE DEVOLUCION DE EQUIPOS INFORMATICOS</option>
        </select>
      </div>

      <div class="form-group" id="grupoNivel">
        <label for="nivel">Nivel de Capacitación *</label>
        <select id="nivel" required>
          <option value="NIVEL I">NIVEL I</option>
          <option value="NIVEL II">NIVEL II</option>
          <option value="NIVEL III">NIVEL III</option>
        </select>
      </div>

      <div class="preview-ruta" id="rutaPreview"></div>

      <div class="form-group">
        <label for="archivo">Archivo PDF *</label>
        <input type="file" id="archivo" accept="application/pdf,.pdf" required>
        <small id="fileInfo" class="hint">Ningún archivo seleccionado.</small>
      </div>

      <button type="submit" id="btnSubir">Subir PDF a Google Drive</button>
    </form>

    <div id="mensaje" class="alert hidden"></div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
